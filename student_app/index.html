<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Application</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>Student Application Form</h1>
    <form id="appForm" action="submit.php" method="POST" enctype="multipart/form-data" novalidate>

      <label>Full Name</label>
      <input type="text" name="full_name" id="full_name" required>
      <small class="error"></small>

      <label>Email</label>
      <input type="email" name="email" id="email" required>
      <small class="error"></small>

      <label>Phone</label>
      <input type="text" name="phone" id="phone" maxlength="10" required>
      <small class="error"></small>

      <label>Date of Birth</label>
      <input type="date" name="dob" id="dob" required>
      <small class="error"></small>

      <label>Gender</label>
      <select name="gender" id="gender" required>
        <option value="">-- Select --</option>
        <option>Male</option><option>Female</option><option>Other</option>
      </select>
      <small class="error"></small>

      <label>Course Applying For</label>
      <select name="course" id="course" required>
        <option value="">-- Select --</option>
        <option>B.Sc Computer Science</option>
        <option>BCA</option>
        <option>B.Com</option>
        <option>BA</option>
      </select>
      <small class="error"></small>

      <label>Previous Percentage (%)</label>
      <input type="number" step="0.01" name="previous_percentage" id="previous_percentage" required>
      <small class="error"></small>

      <label>Address</label>
      <textarea name="address" id="address" rows="3" required></textarea>
      <small class="error"></small>

      <label>Upload Marksheet (PDF/JPG, max 2MB)</label>
      <input type="file" name="document" id="document" accept=".pdf,.jpg,.jpeg,.png">
      <small class="error"></small>

      <button type="submit">Submit Application</button>
    </form>
  </div>
  <script src="js/validate.js"></script>
</body>
</html>
